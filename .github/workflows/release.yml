name: Release

# Creates a GitHub Release whenever a push to main changes package.json's
# version to one that doesn't have a release yet, then stages it for
# publishing to npm.
#
# The release-creation and npm-stage-publish steps live in this single
# workflow/job rather than being split across release.yml + publish.yml
# (release: published) — a release created with the default GITHUB_TOKEN
# does NOT trigger other workflows (GitHub suppresses events caused by
# GITHUB_TOKEN to prevent recursive workflow runs), so a separate
# `on: release: published` workflow would silently never run here. That
# trigger is still useful for a human manually creating a release from
# the GitHub UI, so it stays in publish.yml as a fallback path.
on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Determine tag and whether it already has a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-section.js > /tmp/notes.md
          gh release create "${{ steps.check.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.check.outputs.tag }}" \
            --notes-file /tmp/notes.md
      # Staged publishing requires npm >= 11.15.0; setup-node's bundled
      # npm is usually older.
      - name: Stage publish to npm
        if: steps.check.outputs.exists == 'false'
        run: |
          npm install -g npm@latest
          npm ci
          npm test
          npm stage publish
