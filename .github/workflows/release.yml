name: Release

# Creates a GitHub Release whenever a push to main changes package.json's
# version to one that doesn't have a release yet. Publishing to npm is
# handled separately by publish.yml, triggered by the release this
# workflow creates.
on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Determine tag and whether it already has a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-section.js > /tmp/notes.md
          gh release create "${{ steps.check.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.check.outputs.tag }}" \
            --notes-file /tmp/notes.md
