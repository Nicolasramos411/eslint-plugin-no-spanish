name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Staged publishing requires npm >= 11.15.0; setup-node's bundled
      # npm is usually older.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      # Stages the tarball on the registry without making it public and
      # without a 2FA prompt (safe for CI) — publishing live requires a
      # maintainer to run `npm stage approve <stage-id>` afterwards.
      - run: npm stage publish
