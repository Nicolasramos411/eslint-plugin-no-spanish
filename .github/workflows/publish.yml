name: Publish

# Fallback path for a release created by a human through the GitHub UI
# (or with a PAT). release.yml is the primary path — it creates the
# release AND stages the npm publish in one job, because a release
# created with the default GITHUB_TOKEN (as release.yml's does) does not
# trigger this workflow; see the comment in release.yml.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Staged publishing requires npm >= 11.15.0; setup-node's bundled
      # npm is usually older.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      # Stages the tarball on the registry without making it public and
      # without a 2FA prompt (safe for CI) — publishing live requires a
      # maintainer to run `npm stage approve <stage-id>` afterwards.
      - run: npm stage publish
